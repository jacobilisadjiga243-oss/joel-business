<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Joel Business - Boutique en ligne{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header class="navbar">
    <div class="logo">
        <a href="/">Joel Business</a>
    </div>
    <nav>
        <a href="/">Accueil</a>
        <a href="/produits">Tout voir</a>
        <a href="/produits?categorie=femme">Femme</a>
        <a href="/produits?categorie=homme">Homme</a>
        <a href="/produits?categorie=valise">Valises</a>
        <a href="/produits?categorie=autres">Autres</a>
        <a href="/contact">Contact</a>
        <a href="/panier" class="cart-btn">Panier (<span id="cart-count">0</span>)</a>
    </nav>
</header>

<main>
    {% block content %}{% endblock %}
</main>

<footer>
    <p>2026 Joel Business - Livraison a domicile | Commandes via WhatsApp</p>
</footer>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
