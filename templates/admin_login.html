{% extends "base.html" %}
{% block title %}Connexion Admin{% endblock %}
{% block content %}
<section class="contact-section" style="max-width: 500px;">
    <h1>Espace Admin</h1>
    <div class="contact-form-box">
        <form method="POST" action="/admin">
            <label>Mot de passe</label>
            <input type="password" name="password" required>
            <button type="submit" class="btn-whatsapp" style="background:#111;">Se connecter</button>
        </form>
    </div>
</section>
{% endblock %}
