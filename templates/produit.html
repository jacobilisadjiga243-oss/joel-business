{% extends "base.html" %}
{% block title %}{{ produit.nom }}{% endblock %}
{% block content %}
<section class="produit-detail">
    <div class="detail-img"><img src="{{ image_url(produit.image) }}" alt="{{ produit.nom }}"></div>
    <div class="detail-info">
        <h1>{{ produit.nom }}</h1>
        <p class="prix-grand">{{ produit.prix }} {{ produit.devise }}</p>
        <p>{{ produit.description }}</p>
        <p class="categorie-tag">Categorie : {{ produit.categorie }}</p>
        <button class="btn-primary" onclick="ajouterAuPanier({{ produit.id }}, '{{ produit.nom }}', {{ produit.prix }}, '{{ produit.devise }}', '{{ image_url(produit.image) }}')">Ajouter au panier</button>
        <a href="https://wa.me/243992519112?text=Bonjour%20Joel%20Business%2C%20je%20suis%20interesse%20par%20le%20produit%20%3A%20{{ produit.nom }}%20({{ produit.prix }}%20{{ produit.devise }})." target="_blank" class="btn-whatsapp" style="text-decoration:none; margin-top:10px;">Commander via WhatsApp</a>
    </div>
</section>
{% endblock %}
