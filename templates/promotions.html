{% extends "base.html" %}
{% block title %}Promotions{% endblock %}
{% block content %}
<section class="produits-section">
    <h2>🔥 Nos Promotions</h2>
    <div class="produits-grid">
        {% for p in produits %}
        <div class="produit-card">
            <img src="{{ image_url(p.image) }}" alt="{{ p.nom }}">
            <h3>{{ p.nom }}</h3>
            <p class="prix">{{ p.prix }} {{ p.devise }}</p>
            <a href="/produit/{{ p.id }}" class="btn-secondary">Voir detail</a>
        </div>
        {% else %}<p>Aucune promo.</p>{% endfor %}
    </div>
</section>
{% endblock %}
