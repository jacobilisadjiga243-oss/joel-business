{% extends "base.html" %}
{% block title %}Suivi{% endblock %}
{% block content %}
<section class="contact-section" style="max-width: 600px;">
    <h1 style="text-align:center;">Suivre ma commande</h1>
    <div class="contact-form-box">
        <form method="POST">
            <label>Telephone</label><input type="text" name="telephone" required>
            <label>Reference</label><input type="text" name="reference" required>
            <button type="submit" class="btn-primary">Suivre</button>
        </form>
    </div>
    {% if commande %}<div style="background:white; padding:20px; margin-top:20px; text-align:center;"><h3>Statut : {{ commande.statut }}</h3></div>{% endif %}
</section>
{% endblock %}
